<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinoton 비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-panel">
    <div class="login-brand">
        <span>영업 관리 시스템</span>
    </div>
    <form th:action="@{/password/change}" th:object="${changeRequest}" method="post" class="login-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <h1>비밀번호 변경</h1>
        <p class="form-message">계속 사용하려면 비밀번호를 변경해야 합니다.</p>
        <p th:if="${message}" class="form-message" th:text="${message}">처리되었습니다.</p>
        <p th:if="${errorMessage}" class="form-error" th:text="${errorMessage}">입력값을 확인하세요.</p>

        <label for="currentPassword">현재 비밀번호</label>
        <input id="currentPassword"
               type="password"
               th:field="*{currentPassword}"
               autocomplete="current-password"
               required>

        <label for="newPassword">새 비밀번호</label>
        <input id="newPassword"
               type="password"
               th:field="*{newPassword}"
               autocomplete="new-password"
               minlength="8"
               maxlength="100"
               required>

        <label for="newPasswordConfirm">새 비밀번호 확인</label>
        <input id="newPasswordConfirm"
               type="password"
               th:field="*{newPasswordConfirm}"
               autocomplete="new-password"
               minlength="8"
               maxlength="100"
               required>

        <button type="submit">비밀번호 변경</button>
    </form>
    <form th:action="@{/logout}" method="post" class="password-change-logout-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="secondary-action password-change-logout-button">로그아웃</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: feedbackModal}"></th:block>
</body>
</html>
