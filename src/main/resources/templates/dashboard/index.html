<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Kinoton 영업 관리 대시보드</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(activeMenu='dashboard')}"></aside>
    <main class="content">


        <section class="page-title">
            <div>
                <h1>영업 관리 대시보드</h1>
                <p th:text="${summary.businessYear + '년 사업본부별 영업 현황'}">2026년 사업본부별 영업 현황</p>
            </div>
            <a class="primary-action" th:href="@{/opportunities/new}">+ 신규 영업 사이트 등록</a>
        </section>

        <section class="report-filter-panel year-filter-panel">
            <form th:action="@{/dashboard}" method="get" class="report-filter-form">
                <label>
                    <span>관리 연도</span>
                    <select name="businessYear">
                        <option th:each="year : ${years}"
                                th:value="${year.businessYear}"
                                th:text="${year.businessYear + '년'}"
                                th:selected="${year.businessYear == summary.businessYear}">
                            2026년
                        </option>
                    </select>
                </label>
                <button type="submit">조회</button>
                <a class="secondary-action" th:href="@{/annual-targets(businessYear=${summary.businessYear})}">목표 입력</a>
            </form>
        </section>

        <section class="metric-grid" aria-label="영업 요약">
            <article class="metric-card">
                <span>연간 매출 목표</span>
                <strong th:text="${summary.targetAmount} + '억원'">0억원</strong>
            </article>
            <article class="metric-card">
                <span>확정매출 총액</span>
                <strong th:text="${summary.confirmedRevenueAmount} + '억원'">0억원</strong>
            </article>
            <article class="metric-card">
                <span>현재 달성율</span>
                <strong th:text="${summary.achievementRate} + '%'">0%</strong>
                <small th:text="${'기준일 ' + summary.basisDate}">기준일 2026-06-09</small>
            </article>
            <article class="metric-card">
                <span>기대매출</span>
                <strong th:text="${summary.expectedRevenueAmount} + '억원'">0억원</strong>
            </article>
            <article class="metric-card">
                <span th:text="${summary.businessYear + '년 예상매출'}">2026년 예상매출</span>
                <strong th:text="${summary.forecastRevenueAmount} + '억원'">0억원</strong>
            </article>
        </section>

        <section class="status-strip" aria-label="보류 실주 요약">
            <span>보류·실주</span>
            <strong th:text="${summary.holdCount + summary.lostCount + '건'}">0건</strong>
            <span th:text="${summary.holdLostAmount} + '억원'">0억원</span>
            <small>매출 집계에서 제외, 본부 리스트에서 확인 가능</small>
        </section>

        <section class="module-grid" aria-label="사업본부 요약">
            <article th:each="department : ${departments}"
                     class="module-card"
                     th:classappend="${department.departmentCode == 'DE'} ? ' de' : (${department.departmentCode == 'DX'} ? ' dx' : ' strategy')">
                <h2 th:text="${department.departmentName}">DE 사업본부</h2>
                <dl class="summary-list">
                    <div>
                        <dt>연간 목표</dt>
                        <dd th:text="${department.targetAmount} + '억원'">0억원</dd>
                    </div>
                    <div>
                        <dt>영업 리스트</dt>
                        <dd th:text="${department.opportunityCount} + '건'">0건</dd>
                    </div>
                    <div>
                        <dt>사업총액 합산</dt>
                        <dd th:text="${department.totalProjectAmount} + '억원'">0억원</dd>
                    </div>
                    <div>
                        <dt>확정매출 (90%↑)</dt>
                        <dd class="confirmed" th:text="${department.confirmedRevenueAmount} + '억원'">0억원</dd>
                    </div>
                    <div>
                        <dt>기대매출 (90%↓)</dt>
                        <dd class="expected" th:text="${department.expectedRevenueAmount} + '억원'">0억원</dd>
                    </div>
                    <div>
                        <dt>예상매출</dt>
                        <dd th:text="${department.forecastRevenueAmount} + '억원'">0억원</dd>
                    </div>
                    <div>
                        <dt>달성율</dt>
                        <dd th:text="${department.achievementRate} + '%'">0%</dd>
                    </div>
                    <div>
                        <dt>보류·실주</dt>
                        <dd th:text="${department.holdCount + department.lostCount + '건 · ' + department.holdLostAmount + '억원'}">0건 · 0억원</dd>
                    </div>
                </dl>
                <a th:href="@{/opportunities(departmentCode=${department.departmentCode}, businessYear=${summary.businessYear})}">사이트 목록 보기</a>
            </article>
        </section>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
