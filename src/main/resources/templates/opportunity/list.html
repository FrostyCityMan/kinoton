<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinoton 영업 사이트 리스트</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(activeMenu='opportunity-list')}"></aside>
    <main class="content">

        <section class="page-title">
            <div>
                <h1>영업 사이트 리스트</h1>
                <p th:text="${condition.businessYear + '년 기준 영업 건을 확인합니다.'}">2026년 기준 영업 건을 확인합니다.</p>
            </div>
            <a class="primary-action" th:href="@{/opportunities/new}">+ 신규 등록</a>
        </section>

        <p th:if="${message}" class="form-message" th:text="${message}">처리되었습니다.</p>
        <p th:if="${errorMessage}" class="form-error" th:text="${errorMessage}">처리 오류</p>

        <section class="report-filter-panel">
            <form th:action="@{/opportunities}" method="get" class="report-filter-form opportunity-filter-form">
                <label>
                    <span>관리 연도</span>
                    <select name="businessYear">
                        <option th:each="year : ${years}"
                                th:value="${year.businessYear}"
                                th:text="${year.businessYear + '년'}"
                                th:selected="${year.businessYear == condition.businessYear}">
                            2026년
                        </option>
                    </select>
                </label>
                <input type="hidden" name="departmentCode" th:value="${condition.departmentCode}">
                <label>
                    <span>상태</span>
                    <select name="status">
                        <option value="">전체</option>
                        <option value="IN_PROGRESS" th:selected="${condition.status == 'IN_PROGRESS'}">진행중</option>
                        <option value="WON" th:selected="${condition.status == 'WON'}">수주완료</option>
                        <option value="HOLD" th:selected="${condition.status == 'HOLD'}">보류</option>
                        <option value="LOST" th:selected="${condition.status == 'LOST'}">실주</option>
                    </select>
                </label>
                <label>
                    <span>정렬</span>
                    <select name="sortKey">
                        <option value="CREATED_DESC" th:selected="${condition.sortKey == 'CREATED_DESC'}">등록일 최신순</option>
                        <option value="EXPECTED_ORDER_ASC" th:selected="${condition.sortKey == 'EXPECTED_ORDER_ASC'}">예상발주 빠른순</option>
                        <option value="EXPECTED_DELIVERY_ASC" th:selected="${condition.sortKey == 'EXPECTED_DELIVERY_ASC'}">예상구축 빠른순</option>
                    </select>
                </label>
                <button type="submit">조회</button>
            </form>
        </section>

        <section class="table-panel opportunity-table-panel">
            <table>
                <thead>
                <tr>
                    <th>보안</th>
                    <th>사업본부</th>
                    <th>고객사명</th>
                    <th>사업명</th>
                    <th>예상발주</th>
                    <th>구축시기</th>
                    <th>사업총액</th>
                    <th>담당자</th>
                    <th>상태</th>
                    <th>수주확률</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="opportunity : ${opportunities}">
                    <td>
                        <span class="stage-chip" th:text="${opportunity.securityLevelName}">일반</span>
                    </td>
                    <td th:text="${opportunity.departmentName}">DE 사업본부</td>
                    <td th:text="${opportunity.customerName}">고객사</td>
                    <td>
                        <a class="table-link"
                           th:href="@{/opportunities/{id}(id=${opportunity.opportunityId})}"
                           th:text="${opportunity.projectName}">사업명</a>
                    </td>
                    <td th:text="${opportunity.expectedOrderPeriod}">2026 4Q</td>
                    <td th:text="${opportunity.expectedDeliveryPeriod}">2027 2Q</td>
                    <td th:text="${opportunity.projectAmount} + '억원'">0억원</td>
                    <td th:text="${opportunity.ownerName}">담당자</td>
                    <td th:switch="${opportunity.status}">
                        <span th:case="'IN_PROGRESS'">진행중</span>
                        <span th:case="'WON'">수주완료</span>
                        <span th:case="'HOLD'">보류</span>
                        <span th:case="'LOST'">실주</span>
                        <span th:case="*" th:text="${opportunity.status}">상태</span>
                    </td>
                    <td>
                        <span class="stage-chip"
                              th:text="${opportunity.probability + '% ' + opportunity.probabilityStageName}">
                            10% 영업 시작
                        </span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <a class="table-link" th:href="@{/opportunities/{id}/edit(id=${opportunity.opportunityId})}">수정</a>
                            <form th:action="@{/opportunities/{id}/delete(id=${opportunity.opportunityId})}"
                                  method="post"
                                  th:attr="data-confirm-message=${'영업 사이트 [' + opportunity.projectName + ']를 삭제하시겠습니까? 진행 기록과 첨부파일 정보도 함께 삭제됩니다.'}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="danger-action">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(opportunities)}">
                    <td colspan="11" class="empty-cell">등록된 영업 사이트가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
