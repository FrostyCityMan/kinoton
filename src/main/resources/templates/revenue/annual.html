<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kinoton 연간 매출 목표</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/layout :: sidebar(activeMenu='annual-targets')}"></aside>
    <main class="content">
        <header th:replace="~{fragments/layout :: header}"></header>

        <section class="page-title">
            <div>
                <h1>연간 매출 목표</h1>
                <p>영업관리 연도별로 사업본부 매출 목표를 입력합니다. 저장한 목표는 대시보드 달성율 집계에 반영됩니다.</p>
            </div>
        </section>

        <p th:if="${message}" class="form-message" th:text="${message}">저장되었습니다.</p>
        <p th:if="${errorMessage}" class="form-error" th:text="${errorMessage}">처리 오류</p>

        <section class="filter-panel year-filter-panel">
            <form th:action="@{/annual-targets}" method="get" class="report-filter-form">
                <label>
                    <span>관리 연도</span>
                    <select name="businessYear">
                        <option th:each="year : ${years}"
                                th:value="${year.businessYear}"
                                th:selected="${year.businessYear == response.businessYear()}"
                                th:text="${year.businessYear + '년'}">2026년</option>
                    </select>
                </label>
                <button type="submit" class="secondary-action">조회</button>
            </form>

            <form th:action="@{/annual-targets/years}" method="post" class="year-create-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label>
                    <span>신규 연도</span>
                    <input type="number"
                           name="businessYear"
                           min="2000"
                           max="2100"
                           th:value="${newBusinessYear}"
                           required>
                </label>
                <button type="submit" class="secondary-action year-add-action">연도 추가</button>
            </form>
        </section>

        <section class="status-strip" aria-label="연간 매출 목표 요약">
            <span>
                <strong th:text="${response.businessYear()} + '년'">2026년</strong>
                사업본부별 연간 목표
            </span>
            <span>
                전체 목표
                <strong th:text="${response.totalTargetAmount()} + '억원'">0억원</strong>
            </span>
        </section>

        <section class="settings-panel">
            <div class="settings-heading">
                <div>
                    <h2 th:text="${response.businessYear()} + '년 목표 입력'">2026년 목표 입력</h2>
                    <p>금액 단위는 억원이며, 0 이상 값만 저장할 수 있습니다.</p>
                </div>
            </div>

            <form th:action="@{/annual-targets}" th:object="${saveRequest}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" th:field="*{businessYear}">

                <div class="table-panel target-table-panel">
                    <table>
                        <thead>
                        <tr>
                            <th>사업본부</th>
                            <th>사업본부 코드</th>
                            <th>연간 매출 목표(억원)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="target, iter : ${targets}">
                            <td th:text="${target.departmentName}">DE 사업본부</td>
                            <td th:text="${target.departmentCode}">DE</td>
                            <td>
                                <input type="hidden"
                                       th:field="*{targets[__${iter.index}__].departmentId}">
                                <input type="number"
                                       min="0"
                                       step="0.01"
                                       th:field="*{targets[__${iter.index}__].targetAmount}"
                                       required>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(targets)}">
                            <td colspan="3" class="empty-cell">등록 가능한 활성 사업본부가 없습니다.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="settings-actions">
                    <button type="submit"
                            class="primary-action"
                            th:disabled="${#lists.isEmpty(targets)}">저장</button>
                </div>
            </form>
        </section>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </main>
</div>
</body>
</html>
